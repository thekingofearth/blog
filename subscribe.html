            <div class="card" style="width: 24rem;">

                  <br>
                  <div class="form-group row justify-content-center">
                    <label for="textarea" class="col-sm-3 col-form-label"><strong>Feedback</strong></label>
                    <div class="col-sm-9">
                      <textarea class="form-control" id="textarea" rows="3" placeholder="Feebback please"></textarea>
                    </div>
                  </div>
                  <br>
                  <div class="form-group row justify-content-center">
                    <div class="col-sm-2">
                      <input type="submit" name="submit" id="submit" class="subscribe-button "></input>
                    </div>
                  </div>
              </form>
            </div>

        <br>
        <br>
        <div class="quote-text">
